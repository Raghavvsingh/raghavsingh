<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" fill="none">
  <defs>
    <!-- Drop Shadow / Glow -->
    <filter id="torusGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ffffff" flood-opacity="0.2"/>
    </filter>

    <!-- Outer Chrome Metallic Gradient (Tilted Angle) -->
    <linearGradient id="chromeTorusOuter" x1="30" y1="20" x2="150" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="18%" stop-color="#9aa2b0"/>
      <stop offset="32%" stop-color="#1f2227"/>
      <stop offset="48%" stop-color="#697180"/>
      <stop offset="68%" stop-color="#f5f7fa"/>
      <stop offset="85%" stop-color="#464a53"/>
      <stop offset="100%" stop-color="#181a1e"/>
    </linearGradient>

    <!-- Inner Hole Cutout Gradient (Inverse Shadowing for Depth) -->
    <linearGradient id="chromeTorusInner" x1="60" y1="45" x2="120" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14161a"/>
      <stop offset="25%" stop-color="#3c414c"/>
      <stop offset="60%" stop-color="#d4dbe6"/>
      <stop offset="80%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#2a2d33"/>
    </linearGradient>

    <!-- Specular Highlight Arc -->
    <linearGradient id="specularArc" x1="40" y1="30" x2="110" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Mask to create hollow torus hole -->
    <mask id="torusHoleMask">
      <rect width="180" height="180" fill="#ffffff" />
      <ellipse cx="90" cy="90" rx="38" ry="24" fill="#000000" transform="rotate(-30 90 90)" />
    </mask>
  </defs>

  <g filter="url(#torusGlow)" transform="rotate(5 90 90)">
    <!-- Main Outer Torus Body with Mask -->
    <ellipse cx="90" cy="90" rx="68" ry="44" fill="url(#chromeTorusOuter)" mask="url(#torusHoleMask)" transform="rotate(-30 90 90)" />

    <!-- Inner Rim Depth Layer -->
    <ellipse cx="90" cy="90" rx="38" ry="24" fill="none" stroke="url(#chromeTorusInner)" stroke-width="5" transform="rotate(-30 90 90)" />

    <!-- Outer Rim Highlight -->
    <ellipse cx="90" cy="90" rx="67" ry="43" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.65" transform="rotate(-30 90 90)" />

    <!-- Specular Reflection Glare on Upper Curve -->
    <path d="M 44 65 C 55 42, 85 32, 115 42" stroke="url(#specularArc)" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M 50 68 C 60 48, 85 38, 110 48" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9" />

    <!-- Bottom Secondary Reflection Glare -->
    <path d="M 72 135 C 100 142, 128 132, 138 112" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5" />
  </g>
</svg>
